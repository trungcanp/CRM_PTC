<!-- components/modal-contract.html -->
<div id="contractModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-3 backdrop-blur-sm hidden">
  <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3 shadow-2xl text-xs">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-bold text-slate-800">🎉 Thông Tin Hợp Đồng Giải Ngân</h3>
      <button type="button" onclick="closeContractModal()" class="w-7 h-7 bg-slate-100 rounded-full font-bold">✕</button>
    </div>
    <form onsubmit="saveContractForm(event)" class="space-y-3">
      <div>
        <label class="block font-bold mb-1">Mã số Hợp đồng tín dụng *</label>
        <input id="contractCode" required type="text" class="w-full border rounded-xl p-2 font-mono font-bold">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block font-bold mb-1">Số tiền duyệt (VNĐ) *</label>
          <input id="contractAmount" required type="text" placeholder="50.000.000" class="w-full border rounded-xl p-2 font-bold text-emerald-700">
        </div>
        <div>
          <label class="block font-bold mb-1">Kỳ hạn (Tháng)</label>
          <select id="contractTenor" class="w-full border rounded-xl p-2 bg-white">
            <option value="6">6 Tháng</option>
            <option value="12" selected>12 Tháng</option>
            <option value="18">18 Tháng</option>
            <option value="24">24 Tháng</option>
            <option value="36">36 Tháng</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block font-bold mb-1">Khoản góp / tháng (VNĐ)</label>
          <input id="contractMonthly" type="text" placeholder="3.500.000" class="w-full border rounded-xl p-2">
        </div>
        <div>
          <label class="block font-bold mb-1">Ngày giải ngân</label>
          <input id="contractDate" type="date" class="w-full border rounded-xl p-2">
        </div>
      </div>
      <div class="pt-2 flex gap-2">
        <button type="button" onclick="closeContractModal()" class="w-1/3 py-2 bg-slate-100 rounded-xl font-bold">Đóng</button>
        <button type="submit" class="w-2/3 py-2 bg-emerald-600 text-white rounded-xl font-bold shadow">Lưu Hợp Đồng</button>
      </div>
    </form>
  </div>
</div>
