<!-- components/modal-scan.html -->
<div id="scanModal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-3 backdrop-blur-sm hidden">
  <div class="bg-white w-full max-w-sm rounded-3xl p-4 space-y-3 shadow-2xl text-xs">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-bold text-slate-800">📷 Quét Mã Camera Trực Tiếp</h3>
      <button type="button" onclick="closeScanModal()" class="w-7 h-7 bg-slate-100 rounded-full font-bold">✕</button>
    </div>

    <div class="relative bg-slate-900 rounded-2xl overflow-hidden min-h-[220px] flex items-center justify-center">
      <div id="reader" class="w-full h-full"></div>
    </div>

    <div class="bg-slate-100 p-2 rounded-xl space-y-1">
      <div class="flex justify-between text-[11px] font-bold text-slate-700">
        <span>Thu phóng camera (Zoom):</span>
        <span id="zoomValText">1.0x</span>
      </div>
      <input type="range" id="zoomRange" min="1" max="3" step="0.2" value="1" oninput="handleZoomChange(this.value)" class="w-full accent-blue-600 cursor-pointer">
    </div>

    <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-2xl space-y-1 text-amber-950">
      <span class="font-bold block">💡 Hoặc tải ảnh CCCD chụp sẵn:</span>
      <input type="file" id="qrFileInput" accept="image/*" onchange="handleQrFile(event)" class="w-full text-[10px] file:mr-2 file:py-1 file:px-2 file:rounded-xl file:border-0 file:bg-amber-600 file:text-white file:font-bold cursor-pointer">
    </div>

    <button type="button" onclick="closeScanModal()" class="w-full py-2 bg-slate-100 rounded-xl font-bold">Đóng</button>
  </div>
</div>
