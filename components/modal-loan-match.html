<!-- components/modal-loan-match.html -->
<div id="loanMatchModal" class="fixed inset-0 bg-slate-900/70 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm hidden">
  <div class="bg-slate-50 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-4 max-h-[92vh] overflow-y-auto space-y-3 shadow-2xl">
    
    <!-- Tiêu đề Modal -->
    <div class="flex justify-between items-center border-b pb-2">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-black text-sm">🎯</div>
        <div>
          <h2 class="font-black text-sm text-slate-900">Đề Xuất Gói Vay Khả Thi</h2>
          <p id="matchTargetLeadName" class="text-[10px] text-slate-500 font-medium">Khách hàng: ---</p>
        </div>
      </div>
      <button type="button" onclick="closeLoanMatchModal()" class="w-7 h-7 bg-white rounded-full border border-slate-200 flex items-center justify-center text-slate-500 font-bold">✕</button>
    </div>

    <!-- Tóm tắt hồ sơ khách hàng -->
    <div id="matchLeadSummary" class="bg-white border border-slate-200 rounded-xl p-2.5 text-[11px] grid grid-cols-2 gap-1.5 shadow-sm">
      <!-- Nạp bằng JS -->
    </div>

    <!-- Danh sách các gói vay được lọc tự động -->
    <div class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-black text-slate-800 uppercase tracking-wide">🏆 Gói vay phù hợp nhất:</span>
        <span id="matchStatsBadge" class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">0 gợi ý</span>
      </div>

      <div id="matchedPackagesContainer" class="space-y-2">
        <!-- Nạp danh sách đề xuất bằng JS -->
      </div>
    </div>

    <!-- Nút đóng -->
    <div class="pt-1">
      <button type="button" onclick="closeLoanMatchModal()" class="w-full py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs transition">
        Xong & Về Danh Sách Hồ Sơ
      </button>
    </div>

  </div>
</div>
