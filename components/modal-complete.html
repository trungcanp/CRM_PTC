<!-- components/modal-complete.html -->
<div id="completeModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-3 backdrop-blur-sm hidden">
  <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3 shadow-2xl text-xs">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-bold text-slate-800">📁 Hoàn Thành & Lưu Vào Kho CRM</h3>
      <button type="button" onclick="closeCompleteModal()" class="w-7 h-7 bg-slate-100 rounded-full font-bold">✕</button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="block font-bold mb-1">Lý do đóng hồ sơ *</label>
        <select id="completeReason" class="w-full border rounded-xl p-2 bg-white font-semibold">
          <option value="Đã giải ngân thành công">🎉 Đã giải ngân thành công</option>
          <option value="Khách tự hủy / Không nhu cầu">🛑 Khách tự hủy / Không nhu cầu</option>
          <option value="Bị từ chối tất cả các bên">⛔ Bị từ chối tất cả các bên</option>
          <option value="Nợ xấu nặng">⚠️ Hồ sơ dính nợ xấu</option>
        </select>
      </div>
    </div>
    <div class="pt-2 flex gap-2">
      <button type="button" onclick="closeCompleteModal()" class="w-1/3 py-2 bg-slate-100 rounded-xl font-bold">Đóng</button>
      <button type="button" onclick="saveCompleteLead()" class="w-2/3 py-2 bg-slate-900 text-white rounded-xl font-bold shadow">Xác Nhận Lưu Kho</button>
    </div>
  </div>
</div>
