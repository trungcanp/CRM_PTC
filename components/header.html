<!-- components/header.html -->
<header class="sticky top-0 z-30 shadow-md bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-700 text-white">
  <div class="p-3.5 space-y-2.5">
    <div class="flex items-center justify-between">
      <!-- Logo & Tên ứng dụng (Đã tinh gọn) -->
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-white/25 backdrop-blur rounded-xl flex items-center justify-center font-extrabold text-base shadow-inner">
          💳
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight leading-none">CRM_PTC</h1>
        </div>
      </div>

      <!-- Nhóm nút chức năng đỉnh (Đã bỏ nút Cam) -->
      <div class="flex items-center gap-1.5">
        <!-- Nút Dán QR từ iPhone Shortcut / Bộ nhớ tạm -->
        <button 
          type="button"
          onclick="pasteFromClipboard()" 
          title="Dán nhanh chuỗi QR từ iPhone"
          class="bg-indigo-500 hover:bg-indigo-600 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow flex items-center gap-1 active:scale-95 transition-all">
          <span>📋</span>
          <span class="text-[11px]">Dán QR</span>
        </button>

        <!-- Nút Sao Lưu Telegram / Cài đặt -->
        <button 
          type="button"
          onclick="openBackupModal()" 
          class="bg-blue-800/90 hover:bg-blue-900 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold shadow border border-blue-400/40 flex items-center gap-1 active:scale-95 transition-all">
          <span>💾</span>
          <span class="text-[11px]">Lưu</span>
        </button>

        <!-- Nút Thêm Mới -->
        <button 
          type="button"
          onclick="openCreateModal()" 
          class="bg-white text-blue-700 hover:bg-blue-50 px-3 py-1.5 rounded-xl text-xs font-bold shadow flex items-center gap-1 active:scale-95 transition-all">
          <span>+ Thêm</span>
        </button>
      </div>
    </div>

    <!-- Tab KHÁCH HÀNG -->
    <div class="bg-blue-900/50 p-1 rounded-2xl flex text-xs font-bold border border-blue-400/30">
      <button 
        type="button"
        id="tabActiveBtn"
        onclick="switchTab('active')"
        class="flex-1 py-1.5 rounded-xl text-center flex items-center justify-center gap-1.5 transition-all bg-white text-blue-800 shadow-md">
        <span>⚡ Đang Xử Lý</span>
        <span id="activeCountBadge" class="bg-blue-600 text-white text-[10px] px-1.5 py-0.5 rounded-full font-extrabold">0</span>
      </button>
      <button 
        type="button"
        id="tabArchivedBtn"
        onclick="switchTab('archived')"
        class="flex-1 py-1.5 rounded-xl text-center flex items-center justify-center gap-1.5 transition-all text-blue-200 hover:text-white">
        <span>📁 KHÁCH HÀNG</span>
        <span id="archivedCountBadge" class="bg-blue-800/80 text-blue-200 text-[10px] px-1.5 py-0.5 rounded-full font-extrabold">0</span>
      </button>
    </div>

    <!-- THANH TÌM KIẾM -->
    <div class="relative">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">🔍</span>
      <input 
        id="searchInput"
        oninput="handleSearchInput(event)"
        type="text" 
        placeholder="Tìm tên, SĐT, CCCD, cty góp, mã HĐ..." 
        class="w-full pl-9 pr-8 py-1.5 rounded-xl text-xs bg-white text-slate-800 placeholder-slate-400 focus:outline-none shadow-inner font-medium"
      />
      <button 
        type="button"
        id="clearSearchBtn"
        onclick="clearSearch()"
        class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 hidden">
        ✕
      </button>
    </div>

    <!-- THỐNG KÊ NHANH -->
    <div class="grid grid-cols-4 gap-1.5 pt-2 border-t border-blue-500/40 text-center">
      <div class="bg-blue-800/40 backdrop-blur rounded-lg py-1 px-0.5">
        <div class="text-[10px] text-blue-200">Tổng lọc</div>
        <div id="statFiltered" class="text-xs font-bold">0/0</div>
      </div>
      <div class="bg-blue-800/40 backdrop-blur rounded-lg py-1 px-0.5">
        <div class="text-[10px] text-emerald-300">Chuẩn CIC</div>
        <div id="statCic" class="text-xs font-bold text-emerald-200">0</div>
      </div>
      <div class="bg-blue-800/40 backdrop-blur rounded-lg py-1 px-0.5">
        <div class="text-[10px] text-amber-200">Có duyệt vay</div>
        <div id="statApproved" class="text-xs font-bold text-amber-100">0</div>
      </div>
      <div class="bg-blue-800/40 backdrop-blur rounded-lg py-1 px-0.5">
        <div class="text-[10px] text-purple-200">Đã giải ngân</div>
        <div id="statDisbursed" class="text-xs font-bold text-purple-200">0</div>
      </div>
    </div>
  </div>
</header>
