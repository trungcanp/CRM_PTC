<!-- components/modal-backup.html -->
<div id="backupModal" class="fixed inset-0 bg-slate-950/75 z-50 flex items-center justify-center p-3 backdrop-blur-md overflow-y-auto hidden">
<div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3.5 shadow-2xl border border-slate-200 text-xs animate-in fade-in duration-150">
<!-- Tiêu đề Modal -->
<div class="flex justify-between items-center border-b pb-2.5">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-xl bg-sky-100 text-sky-700 flex items-center justify-center text-base font-black">✈️</div>
<div>
<h3 class="font-extrabold text-slate-900 text-sm">Đồng Bộ & Sao Lưu</h3>
<p class="text-[10px] text-slate-500 font-medium">Bảo Mật Kênh Telegram</p>
</div>
</div>
<button type="button" onclick="closeBackupModal()" class="w-7 h-7 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center font-bold">✕</button>
</div>
<!-- KHUNG CẤU HÌNH TELEGRAM (CÓ PHẢN HỒI NỔI 100%) -->
<div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 space-y-2.5">
<div class="flex justify-between items-center">
<span class="font-extrabold text-slate-800 text-[11px] flex items-center gap-1">
<span>⚙️</span> Khóa Kết Nối Telegram
</span>
<span id="tgConfigStatusBadge" class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">Chưa kiểm tra</span>
</div>
<div class="space-y-2">
<div>
<label class="block text-[10px] font-bold text-slate-600 mb-0.5">Bot Token (từ @BotFather):</label>
<div class="relative">
<input 
id="cfgTgToken" 
type="password" 
placeholder="Dán mã Token vào đây..." 
oninput="checkTgInputStatus()"
class="w-full border-2 border-slate-200 focus:border-blue-500 rounded-xl p-2 pr-8 font-mono text-[10px] bg-white text-slate-900 outline-none transition"
>
<button 
type="button" 
onclick="toggleTokenVisibility()" 
title="Hiện/Ẩn Token"
class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-xs p-0.5 font-bold">
👁️
</button>
</div>
</div>
<div>
<label class="block text-[10px] font-bold text-slate-600 mb-0.5">Chat ID Kênh (Ví dụ: -1004351522635):</label>
<input 
id="cfgTgChatId" 
type="text" 
placeholder="-1004351522635" 
oninput="checkTgInputStatus()"
class="w-full border-2 border-slate-200 focus:border-blue-500 rounded-xl p-2 font-mono text-[10px] bg-white text-slate-900 outline-none transition"
>
</div>
<!-- NÚT LƯU TO RÕ RÀNG VỚI PHẢN HỒI KÉP -->
<button 
type="button" 
id="btnSaveTgConfig"
onclick="handleSaveTgClick()" 
class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-black py-2.5 rounded-xl text-xs shadow transition flex items-center justify-center gap-1.5 cursor-pointer">
<span>💾</span>
<span id="btnSaveTgText">Lưu Cấu Hình Kết Nối</span>
</button>
</div>
</div>
<!-- BẬT/TẮT BÁO CÁO TỰ ĐỘNG -->
<div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-2.5 space-y-1 text-emerald-950">
<div class="flex items-center justify-between">
<span class="font-bold flex items-center gap-1 text-[11px] text-emerald-900">
<span>⚡</span> Báo Telegram Khi Có KH Mới
</span>
<label class="relative inline-flex items-center cursor-pointer">
<input type="checkbox" id="autoNotifyTg" onchange="toggleAutoNotify(this)" class="sr-only peer">
<div class="w-8 h-4 bg-slate-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-emerald-600"></div>
</label>
</div>
<p class="text-[9px] text-emerald-800 leading-tight">
Tự động gửi thông báo ngắn về kênh khi thêm, sửa hoặc duyệt hồ sơ.
</p>
</div>
<!-- CÁC NÚT SAO LƯU & NẠP DỮ LIỆU TELEGRAM -->
<div class="grid grid-cols-2 gap-2 pt-1">
<button type="button" onclick="backupToTelegram()" class="bg-sky-600 hover:bg-sky-700 text-white font-extrabold py-2.5 px-2 rounded-xl text-xs shadow active:scale-95 flex items-center justify-center gap-1 transition">
<span>🚀</span>
<span>Gửi Lên Kênh</span>
</button>
<button type="button" onclick="restoreFromTelegram()" class="bg-slate-800 hover:bg-slate-900 text-white font-extrabold py-2.5 px-2 rounded-xl text-xs shadow active:scale-95 flex items-center justify-center gap-1 transition">
<span>🔄</span>
<span>Nạp Bản Mới Nhất</span>
</button>
</div>
<!-- SAO LƯU VỀ MÁY / COPY -->
<div class="pt-2 border-t border-slate-100 space-y-1.5">
<div class="grid grid-cols-2 gap-2">
<button type="button" onclick="downloadBackupFile()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-[10px] transition">📥 Tải File JSON</button>
<button type="button" onclick="copyBackupText()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-[10px] transition">📋 Copy Mã JSON</button>
</div>
<label class="block text-[10px] text-slate-500 font-medium pt-0.5">Khôi phục từ tệp có sẵn trên máy:</label>
<input type="file" accept=".json" onchange="restoreFromFile(event)" class="w-full text-[10px] file:mr-2 file:py-1 file:px-2 file:rounded-xl file:border-0 file:bg-slate-200 file:text-slate-700 file:font-bold cursor-pointer">
</div>
<button type="button" onclick="closeBackupModal()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs transition">
Đóng
</button>
</div>
</div>
<script>
// Tự động kiểm tra trạng thái Token ngay khi gõ hoặc mở bảng
function checkTgInputStatus() {
const t = (document.getElementById('cfgTgToken')?.value || '').trim();
const c = (document.getElementById('cfgTgChatId')?.value || '').trim();
const badge = document.getElementById('tgConfigStatusBadge');
if (!badge) return;
if (t && c) {
badge.className = 'text-[9px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200';
badge.innerText = '✓ Đã kết nối';
} else {
badge.className = 'text-[9px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-200';
badge.innerText = '⚠️ Chưa lưu đủ';
}
}
// Xử lý trực tiếp nút lưu chống kẹt cache
function handleSaveTgClick() {
if (typeof saveCustomTgConfig === 'function') {
saveCustomTgConfig();
} else {
const t = (document.getElementById('cfgTgToken')?.value || '').trim();
const c = (document.getElementById('cfgTgChatId')?.value || '').trim();
if (t) localStorage.setItem('crm_tg_token', t);
if (c) localStorage.setItem('crm_tg_chatid', c);
checkTgInputStatus();
alert('✅ ĐÃ LƯU THÀNH CÔNG!\n\nBot Token và Chat ID đã được lưu vĩnh viễn trên máy của bạn.');
}
}
</script>
