<!-- components/modal-receipt.html -->
<div id="receiptModal" class="fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center p-3 backdrop-blur-md hidden">
  <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl border border-slate-200 text-xs">
    <div id="receiptHeader" class="p-4 text-white bg-gradient-to-r from-blue-700 via-indigo-700 to-slate-800 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div id="receiptLogoEmoji" class="w-8 h-8 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center text-base">🏦</div>
        <div>
          <span class="text-[9px] uppercase tracking-wider opacity-80 block">Lịch Trình Thanh Toán Khoản Vay</span>
          <h3 id="receiptLenderTitle" class="font-extrabold text-sm">---</h3>
        </div>
      </div>
      <button type="button" onclick="closeReceiptModal()" class="w-7 h-7 bg-white/20 rounded-full font-bold flex items-center justify-center">✕</button>
    </div>

    <div class="p-4 space-y-3">
      <div class="bg-slate-50 p-2.5 rounded-xl border flex justify-between items-center">
        <div>
          <span class="text-[10px] text-slate-400 block font-medium">Khách hàng</span>
          <b id="receiptName" class="text-slate-900 text-sm">---</b>
        </div>
        <div class="text-right">
          <span class="text-[10px] text-slate-400 block font-medium">Số điện thoại</span>
          <b id="receiptPhone" class="font-mono text-slate-800">---</b>
        </div>
      </div>

      <div class="bg-emerald-50 border border-emerald-300 p-3.5 rounded-2xl text-center space-y-1 shadow-sm">
        <div class="text-[10px] uppercase font-bold text-emerald-800 tracking-wide">💰 Số Tiền Góp Định Kỳ Mỗi Tháng</div>
        <div id="receiptMonthlyPay" class="text-2xl font-black text-emerald-700">0 đ</div>
        <div class="text-[10px] text-slate-600">
          Kỳ hạn: <b id="receiptTenor">12 tháng</b> • Mã HĐ: <b id="receiptCode" class="font-mono text-slate-800 font-bold">---</b>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-2.5 text-center">
          <span class="text-[10px] text-blue-700 font-bold block">📅 Ngày Đóng Kỳ 1</span>
          <div id="receiptFirstDate" class="text-xs font-mono font-extrabold text-blue-900 mt-0.5">---</div>
        </div>
        <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-2.5 text-center">
          <span class="text-[10px] text-indigo-700 font-bold block">🏁 Ngày Tất Toán Cuối</span>
          <div id="receiptLastDate" class="text-xs font-mono font-extrabold text-indigo-900 mt-0.5">---</div>
        </div>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-[11px] space-y-1 text-slate-700">
        <div class="font-bold text-slate-900 flex items-center gap-1">
          <span>🏦</span> Hướng dẫn đóng tiền theo đơn vị:
        </div>
        <p id="receiptGuideText" class="text-[10px] text-slate-600 leading-tight">
          ---
        </p>
      </div>

      <button type="button" onclick="copyPaymentMsg()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow flex items-center justify-center gap-1.5">
        <span>📋</span> Copy Lịch Trả Nợ Cho Khách
      </button>
    </div>
  </div>
</div>
